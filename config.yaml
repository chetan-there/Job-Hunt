# jobhunt configuration. Everything tunable lives here — no editing Python.
#
# Tuned for Chetan's current resume:
# - Final-year B.E. Computer Engineering / 2026 graduate
# - Java + Spring Boot backend
# - Python + AI/LLM
# - React full-stack
# - REST APIs / SQL / MySQL / Oracle
# - Spring Security / JWT / RBAC
# - Kafka / Microservices
# - JUnit / Mockito / pytest
#
# Target level: Entry-level / Graduate / Junior Software Engineer
# Primary focus: Backend Java + Full Stack + AI/Software Engineering

filters:
  # Title regexes, matched case-insensitively against the job title only.
  # A title must match at least one include AND zero excludes.
  #
  # Keep these broad enough to catch Java/Spring/Backend/Full Stack/AI roles
  # while avoiding unrelated engineering disciplines.
  include_titles:
    # Core Software Engineering
    - '\bsoftware engineer\b'
    - '\bsoftware development engineer\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,3}|[123])\b'
    - '\bsoftware developer\b'
    - '\bapplication engineer\b'
    - '\bapplication developer\b'

    # Backend / Java
    - '\bbackend engineer\b'
    - '\bback-end engineer\b'
    - '\bbackend developer\b'
    - '\bback-end developer\b'
    - '\bjava engineer\b'
    - '\bjava developer\b'
    - '\bjava software engineer\b'
    - '\bspring boot engineer\b'
    - '\bspring boot developer\b'

    # Full Stack
    - '\bfull[\s-]?stack engineer\b'
    - '\bfull[\s-]?stack developer\b'
    - '\bfull[\s-]?stack software engineer\b'

    # Python / AI / GenAI
    - '\bpython engineer\b'
    - '\bpython developer\b'
    - '\bai engineer\b'
    - '\bai software engineer\b'
    - '\bgenerative ai engineer\b'
    - '\bgenai engineer\b'
    - '\bllm engineer\b'
    - '\bmachine learning engineer\b'
    - '\bml engineer\b'
    - '\bai developer\b'

    # Platform / API / Distributed backend roles
    - '\bplatform engineer\b'
    - '\bapi engineer\b'
    - '\bbackend software engineer\b'
    - '\bdistributed systems engineer\b'

    # General entry-level engineering titles
    - '\bmember of technical staff\b'
    - '\btechnical engineer\b'

  # Anything matching these is dropped even if an include matched.
  exclude_titles:
    # Too senior for current experience level
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\blead\b'
    - '\btech lead\b'
    - '\bteam lead\b'

    # Management / leadership
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'

    # Internship / trainee roles
    #
    # Your resume has completed internship experience, so prioritize
    # actual entry-level/full-time roles rather than trainee programs.
    - '\b(intern|internship|apprentice|trainee)\b'

    # Non-engineering roles
    - '\b(sales|account executive|marketing|recruit|recruiter|support|customer success)\b'

    # Frontend/mobile/design specializations that don't match your target
    # backend/full-stack profile.
    - '\b(frontend|front-end)\b'
    - '\bios\b'
    - '\bandroid\b'
    - '\bmobile\b'
    - '\bgame developer\b'
    - '\bdesigner\b'
    - '\bux\b'
    - '\bui designer\b'

    # Data/research roles that are not aligned with your current profile
    - '\bdata scientist\b'
    - '\bmachine learning scientist\b'
    - '\bresearch scientist\b'
    - '\bresearch engineer\b'
    - '\bdata analyst\b'
    - '\bdata engineer\b'

    # Hardware / low-level roles not supported by the resume
    - '\bembedded\b'
    - '\bfirmware\b'
    - '\bkernel\b'
    - '\bdriver\b'
    - '\bnetwork engineer\b'
    - '\bnetworking engineer\b'

  # Substrings matched against "<location> <title>", case-insensitive.
  #
  # Your resume is based in Nagpur, but for software jobs you should
  # prioritize the major Indian technology hubs plus remote roles.
  locations:
    - nagpur
    - pune
    - mumbai
    - bangalore
    - bengaluru
    - hyderabad
    - chennai
    - gurgaon
    - gurugram
    - noida
    - delhi
    - india

  # If true, anything reading as remote passes the location gate.
  allow_remote: true

  # Drop postings older than this.
  # Keep this reasonably tight because you're actively job hunting.
  max_age_days: 30

# --- LLM stages -------------------------------------------------------------
#
# These settings don't need major changes for your resume.
# Screening should remain relatively cheap because many companies
# may have Java/backend/full-stack openings.

screen_batch_size: 8
screen_jd_chars: 1600
draft_jd_chars: 6000

# 7/10 is a reasonable starting threshold.
# Raise to 7.5-8 after you start getting too many results.
score_threshold: 5.0

# Number of jobs that receive expensive draft calls.
max_per_digest: 5

# --- paths ------------------------------------------------------------------

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv

